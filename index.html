<style>
:root{--bg:#f3f5f4;--card:#fff;--tx:#14201a;--mu:#5d6b64;--ac:#17995a;--on:#fff;--bd:#e0e6e2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1512;--card:#19211d;--tx:#eaf1ed;--mu:#97a69d;--ac:#2fc27a;--on:#06140c;--bd:#2a3530}}
:root[data-theme="dark"]{--bg:#0f1512;--card:#19211d;--tx:#eaf1ed;--mu:#97a69d;--ac:#2fc27a;--on:#06140c;--bd:#2a3530}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:10}
button,input{font:inherit;color:inherit}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--card);border-bottom:1px solid var(--bd);z-index:11}
.bar{display:flex;align-items:center;gap:8px;padding:8px 12px}
.bar h1{font-size:18px;margin:0;font-weight:700}
.ib{width:44px;height:44px;border:0;background:none;border-radius:12px;display:grid;place-items:center;cursor:pointer}
.ib svg{width:24px;height:24px;stroke:var(--tx);fill:none;stroke-width:2;stroke-linecap:round}
.tabs{display:flex}
.tabs button{flex:1;padding:12px;border:0;background:none;font-weight:600;color:var(--mu);border-bottom:3px solid transparent;cursor:pointer}
.tabs button.on{color:var(--ac);border-color:var(--ac)}
main{padding:16px;max-width:560px;margin:0 auto}
.empty{text-align:center;color:var(--mu);padding:56px 16px}
.empty b{display:block;color:var(--tx);font-size:18px;margin-bottom:6px}
.fab{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;border:0;background:#2f6fed;color:#fff;font-size:32px;line-height:1;box-shadow:0 4px 14px rgba(0,0,0,.3);cursor:pointer;z-index:9}
.auth{max-width:380px;margin:0 auto;padding:40px 20px}
.auth h2{margin:0 0 4px;font-size:26px}
.auth p{color:var(--mu);margin:0 0 20px}
.seg{display:flex;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:4px;margin-bottom:16px}
.seg button{flex:1;padding:10px;border:0;border-radius:9px;background:none;font-weight:600;color:var(--mu);cursor:pointer}
.seg button.on{background:var(--ac);color:var(--on)}
label{display:block;font-size:14px;color:var(--mu);margin:12px 0 6px}
input{width:100%;padding:13px;border:1px solid var(--bd);border-radius:12px;background:var(--card);font-size:16px}
.btn{width:100%;margin-top:20px;padding:14px;border:0;border-radius:12px;background:var(--ac);color:var(--on);font-weight:700;cursor:pointer}
.err{color:#d33;font-size:14px;min-height:20px;margin-top:10px}
.note{font-size:13px;color:var(--mu);margin-top:18px;text-align:center}
.shade{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:none}
.shade.show{display:block}
.drawer{position:fixed;top:0;bottom:0;left:0;width:82%;max-width:320px;background:var(--card);z-index:21;transform:translateX(-102%);transition:transform .2s;padding:calc(20px + env(safe-area-inset-top,0px)) 16px 16px;display:flex;flex-direction:column;gap:8px}
.drawer.show{transform:none}
.drawer .who{padding:8px 4px 16px;border-bottom:1px solid var(--bd);margin-bottom:8px}
.drawer .who small{color:var(--mu);display:block}
.drawer .who span{word-break:break-all;font-weight:600}
.item{text-align:left;padding:14px 12px;border:0;background:none;border-radius:12px;cursor:pointer;font-weight:500}
.item:active{background:var(--bg)}
.item.danger{color:#d33}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:20px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30;max-width:90%;text-align:center}
#toast.show{opacity:1}
.team{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:10px;cursor:pointer}
.cr{width:48px;height:48px;border-radius:10px;background:var(--bg);display:grid;place-items:center;font-size:24px;overflow:hidden;flex:none}
.cr img,.crest img{width:100%;height:100%;object-fit:contain}
.tn b{display:block}.tn small{color:var(--mu)}
.form{max-width:420px;margin:0 auto;padding:24px 20px 40px}
.form h2{text-align:center;margin:0 0 20px}
.crest{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;width:150px;height:150px;margin:0 auto;border:2px dashed var(--bd);border-radius:20px;background:var(--card);cursor:pointer;overflow:hidden;color:var(--mu);padding:0}
.crest span{font-size:44px;line-height:1;color:#2f6fed}
.actions{display:flex;gap:12px;margin-top:20px}
.actions .btn{margin-top:0}
.btn.sec{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.form .seg{margin-bottom:4px}
.form .seg button{font-size:14px;padding:10px 4px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
select{width:100%;padding:13px;border:1px solid var(--bd);border-radius:12px;background:var(--card);font:inherit;color:inherit}
.hint{font-size:13px;color:var(--mu);margin-top:8px}
.dot{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.sec2{margin:24px 0 0;font-size:15px;font-weight:700}
.tn{flex:1;min-width:0}
.cr.sm{width:30px;height:30px;font-size:16px;border-radius:8px}
.x{border:0;background:none;color:var(--mu);font-size:18px;padding:8px;cursor:pointer}
.pk .ck{opacity:0;color:#2f6fed;font-weight:700;font-size:20px}
.pk.on{border-color:#2f6fed}
.pk.on .ck{opacity:1}
.tbl{border-radius:14px;overflow:hidden;border:1px solid var(--bd)}
.trow{display:grid;grid-template-columns:24px 1fr 34px 38px 38px;align-items:center;gap:6px;padding:8px 10px;background:var(--card);border-left:5px solid transparent;border-bottom:1px solid var(--bd);text-align:center;font-size:15px}
.trow:last-child{border-bottom:0}
.trow .nm{display:flex;align-items:center;gap:8px;text-align:left;min-width:0}
.trow .nm b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow.hd{color:var(--mu);font-size:12px;font-weight:700}
.pt{font-weight:700}
.jh{margin:18px 0 8px;font-weight:700;color:var(--mu);font-size:14px}
.mt{display:grid;cursor:pointer;grid-template-columns:1fr 44px 1fr;align-items:center;gap:8px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px;margin-bottom:8px;font-size:15px}
.mt .l{display:flex;justify-content:flex-end;align-items:center;gap:8px;text-align:right}
.mt .r{display:flex;align-items:center;gap:8px}
.mt .vs{text-align:center;color:var(--mu);font-size:13px}
.bg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bg>:only-child{grid-column:1/-1}
.bm{background:var(--card);border:1px solid var(--bd);border-radius:12px;overflow:hidden}
.bm.ok{cursor:pointer;border-color:#2f6fed}
.bt{display:flex;align-items:center;gap:6px;padding:8px;font-size:14px}
.bt+.bt,.bt+.bye{border-top:1px solid var(--bd)}
.bt.w{font-weight:700;background:rgba(47,111,237,.14)}
.bn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bn.mu{color:var(--mu);font-weight:400}
.bye{padding:8px;font-size:12px;color:var(--mu);text-align:center}
.arr{text-align:center;color:var(--mu);margin:8px 0 0}
.champ{text-align:center;margin:20px 0;font-size:18px;padding:16px;background:var(--card);border-radius:14px;border:1px solid var(--bd)}
.mv{display:grid;grid-template-columns:1fr 20px 1fr;align-items:start;gap:8px;margin:10px 0}
.mv .vs{text-align:center;color:var(--mu);padding-top:28px;font-size:24px}
.side{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.side b{word-break:break-word}
.side input{text-align:center;font-size:28px;font-weight:700;padding:10px}
.cr.lg{width:72px;height:72px;font-size:36px;border-radius:16px}
.actions3{display:flex;gap:10px;margin-top:20px}
.actions3 .btn{margin-top:0;padding:14px 4px}
.btn.danger{color:#d33}
.bar h1{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sbtn{margin-left:auto;flex:none;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:20px;padding:8px 14px;font-weight:600;font-size:14px;cursor:pointer}
.pan{padding:12px 16px;border-top:1px solid var(--bd);background:var(--card)}
.pan[hidden]{display:none}
.pan p{margin:6px 0 10px;color:var(--mu);font-size:14px}
.pan .btn{margin-top:0}
.team{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sh{background:var(--card);width:100%;max-width:480px;border-radius:20px 20px 0 0;padding:20px 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px}
.sh b{font-size:17px;padding:4px 8px}
.sh p{margin:0;padding:0 8px 8px;color:var(--mu);font-size:14px}
.sh .item{text-align:center;background:var(--bg)}
.seg.sc{overflow-x:auto}
.seg.sc button{flex:none;padding:10px 14px;white-space:nowrap}
input[readonly]{opacity:.7}
.rk{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--card);border-bottom:1px solid var(--bd)}
.rk:last-child{border-bottom:0}
.rk .n{width:24px;text-align:center;font-weight:700;color:var(--mu)}
.rk .v{color:var(--mu);font-size:13px;white-space:nowrap}
.rk .v b{color:var(--tx);font-size:16px}
.jh{display:flex;align-items:center;justify-content:space-between}
.sim{border:1px solid var(--bd);background:var(--card);color:#2f6fed;border-radius:16px;padding:6px 12px;font-weight:600;font-size:13px;cursor:pointer}
.lgi{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:8px;font-size:15px}
.chips{display:flex;gap:8px;margin-top:8px}
.tabs button{font-size:14px;padding:12px 4px}
.sb{display:flex;align-items:center;gap:8px;padding:8px 12px;border-top:1px solid var(--bd)}
.sb span{font-size:18px}
.sb input{padding:10px 12px;border-radius:10px}
.mow{width:46px;text-align:right;flex:none}
.mo{font-size:13px;font-weight:700;color:var(--mu)}
.mo.up{color:#14a05a}
.mo.dn{color:#d93636}
.ro #menu,.ro .fab,.ro .csim,.ro .sim,.ro #redraw,.ro .x{display:none!important}
.ro .team,.ro .mt,.ro .bm{cursor:default}
</style>
</head>
<body>
<div id="app"></div>
<div class="shade" id="shade"></div>
<aside class="drawer" id="drawer"></aside>
<div id="toast"></div>
<script>
(function(){
var S={tab:"torneos",mode:"in",confirmClear:false,view:null,edit:null,crest:""};
var $=function(i){return document.getElementById(i)};
var sn=$("snap"),RO=!!sn,SNAPSTR=sn?sn.textContent:"";
function get(k){try{return localStorage.getItem(k)}catch(e){return null}}
function set(k,v){try{localStorage.setItem(k,v)}catch(e){try{toast("No hay espacio para guardar. Haz una copia de seguridad.")}catch(x){}}}
function del(k){try{localStorage.removeItem(k)}catch(e){}}
function toast(m){var t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(toast.h);toast.h=setTimeout(function(){t.classList.remove("show")},2200)}
function drawer(open){$("drawer").classList.toggle("show",open);$("shade").classList.toggle("show",open);if(!open){S.confirmClear=false}}
$("shade").onclick=function(){drawer(false)};

function renderMain(){
  var t=S.tab==="torneos";
  $("app").innerHTML='<header><div class="bar"><button class="ib" id="menu" aria-label="Menú"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button><h1>Liga Manager</h1></div>'+
  '<div class="tabs"><button id="t1" class="'+(t?"on":"")+'">Torneos</button><button id="t2" class="'+(S.tab==="equipos"?"on":"")+'">Equipos</button><button id="t3" class="'+(S.tab==="ranking"?"on":"")+'">Ranking</button><button id="t4" class="'+(S.tab==="calendario"?"on":"")+'">Calendario</button></div>'+(S.tab==="equipos"?'<div class="sb"><span>🔍</span><input id="eq" type="search" placeholder="Buscar equipo" value="'+esc(S.eq||"")+'"></div>':'')+'</header>'+(RO?'<div class="hint" style="padding:8px 16px;text-align:center;margin:0">Vista pública · solo lectura</div>':'')+
  '<main>'+body()+'</main>'+
  (S.tab==="ranking"||S.tab==="torneos"||S.tab==="calendario"?"":'<button class="fab" id="fab" aria-label="Añadir">+</button>');
  $("menu").onclick=function(){drawer(true)};
  $("t1").onclick=function(){S.tab="torneos";renderMain()};
  $("t2").onclick=function(){S.tab="equipos";renderMain()};
  $("t3").onclick=function(){S.tab="ranking";renderMain()};
  $("t4").onclick=function(){S.tab="calendario";renderMain()};
  calWire();
  var eq=$("eq");if(eq){eq.oninput=function(){S.eq=eq.value;paintEq()}}
  var rsb=document.querySelectorAll("main .seg button");
  for(var q2=0;q2<rsb.length;q2++){(function(b){b.onclick=function(){S.rk=+b.getAttribute("data-v")===1;renderMain()}})(rsb[q2])}
  if($("fab")){$("fab").onclick=function(){if(t){openTForm()}else{openForm(null)}}}
  var cs=document.querySelectorAll(".team");
  for(var k=0;k<cs.length;k++){(function(el){el.onclick=function(){if(el.hasAttribute("data-i")){openForm(+el.getAttribute("data-i"))}else{openDetail(+el.getAttribute("data-t"))}};if(el.hasAttribute("data-i")){lp(el,function(){delItem(el)})}})(cs[k])}
}

function renderDrawer(){
  var e=get("fm_session");
  var h='<div class="who"><small>App</small><span>Datos en este móvil · espacio usado aprox. '+Math.round((get("fm_data")||"").length/50000)+' %</span></div>';
  h+='<button class="item" id="d_bk">Copia de seguridad</button><button class="item" id="d_rs">Restaurar copia</button><button class="item" id="d_pb">Publicar vista pública</button><input type="file" id="d_f" accept=".json,application/json" hidden>';
  h+='<button class="item danger" id="d_clr">'+(S.confirmClear?"Pulsa otra vez para confirmar":"Borrar datos locales")+'</button>';
  h+='<button class="item" id="d_sh">Compartir app</button>';
  $("drawer").innerHTML=h;
  
  $("d_bk").onclick=function(){drawer(false);backup()};
  $("d_pb").onclick=function(){drawer(false);publicar()};
  $("d_rs").onclick=function(){$("d_f").click()};
  $("d_f").onchange=function(){var f=this.files[0];if(!f){return}var r=new FileReader();r.onload=function(){try{var o=JSON.parse(r.result);if(!o||!Array.isArray(o.teams)){throw 0}set("fm_data",JSON.stringify(o));S.view=null;drawer(false);render();toast("Copia restaurada")}catch(x){toast("El archivo no es una copia válida")}};r.readAsText(f)};
  
  $("d_clr").onclick=function(){
    if(!S.confirmClear){S.confirmClear=true;renderDrawer();return}
    del("fm_data");S.confirmClear=false;S.view=null;drawer(false);render();toast("Datos locales borrados");
  };
  $("d_sh").onclick=function(){

    else{h+=seg("pf",[[0,"Todos"],[1,"Pendientes"]],S.pf?1:0);var np=sched(ids,t.legs).reduce(function(s,rd){return s+rd.filter(function(p){return !getRes(t,lkey(p),p[0],p[1])}).length},0);if(S.pf&&!np){h+='<div class="empty"><b>Todo jugado</b>No quedan partidos pendientes.</div>'}sched(ids,t.legs).forEach(function(rd,k){var pend=rd.filter(function(p){return !getRes(t,lkey(p),p[0],p[1])}).length;if(S.pf&&!pend){return}h+='<div class="jh"><span>Jornada '+(k+1)+'</span>'+(pend?'<button class="sim" data-k="'+k+'">Simular jornada</button>':'')+'</div>';rd.forEach(function(p){var a=team(d,p[0]),b=team(d,p[1]),r=getRes(t,lkey(p),p[0],p[1]);if(S.pf&&r){return}h+='<div class="mt" data-k="'+k+'" data-h="'+p[0]+'" data-a="'+p[1]+'" data-g="'+p[2]+'"><span class="l">'+esc(a.name)+cr(a)+'</span><span class="vs">'+(r?r[0]+"-"+r[1]:"vs")+'</span><span class="r">'+cr(b)+esc(b.name)+'</span></div>'})})}
  }
  h+='</main>';
  if(S.dt==="equipos"&&(!t.fixed||t.fixed==="liga")){h+='<button class="fab" id="fab" aria-label="Añadir equipos">+</button>'}
  $("app").innerHTML=h;
  $("app").querySelector("h1").textContent=t.name;
  $("bk").onclick=function(){S.view=null;S.tab="torneos";render()};
  var tb=document.querySelectorAll(".tabs button");
  for(var i=0;i<tb.length;i++){(function(b){b.onclick=function(){S.dt=b.getAttribute("data-d");renderDetail()}})(tb[i])}
  var sb=document.querySelectorAll("main .seg button");
  for(var j=0;j<sb.length;j++){(function(b){b.onclick=function(){var v=+b.getAttribute("data-v");if(b.parentNode.id==="pf"){S.pf=!!v}else{S.dl=v}renderDetail()}})(sb[j])}
  var xs=document.querySelectorAll(".x");
  for(var k=0;k<xs.length;k++){(function(b){b.onclick=function(){var id=+b.getAttribute("data-r");if(t.kind==="torneo"){revRes(d,t);delete t.draw;t.res={}}if(b.getAttribute("data-a")){t.ex=(t.ex||[]).concat([id])}else{t.members=t.members.filter(function(m){return m.id!==id})}save(d);renderDetail()}})(xs[k])}
  if($("fab")){$("fab").onclick=openPicker}
  var mt=document.querySelectorAll(".mt");
  for(var a=0;a<mt.length;a++){(function(el){el.onclick=function(){var hh=+el.getAttribute("data-h"),aa=+el.getAttribute("data-a"),g=+el.getAttribute("data-g");S.mk={title:"Jornada "+(+el.getAttribute("data-k")+1),legs:[{key:lkey([hh,aa,g]),x:hh,y:aa,label:""}],ko:false};S.view="match";render()}})(mt[a])}
  var bm=document.querySelectorAll(".bm.ok");
  for(var c=0;c<bm.length;c++){(function(el){el.onclick=function(){var r=+el.getAttribute("data-r"),i=+el.getAttribute("data-i"),B=brk(t),m=B.rs[r][i],lg=[{key:"b"+r+"|"+i+"|1",x:m.a,y:m.b,label:"Ida"}];if(t.mode==="double"){lg.push({key:"b"+r+"|"+i+"|2",x:m.a,y:m.b,label:"Vuelta"})}S.mk={title:rname(r,B.rs.length),legs:lg,ko:true};S.view="match";render()}})(bm[c])}
  var rd=$("redraw");
  if(rd){rd.onclick=function(){if(!S.rc){S.rc=true;rd.textContent="Pulsa otra vez para confirmar";return}revRes(d,t);delete t.draw;t.res={};S.rc=false;save(d);renderDetail()}}
  var sn=$("sn");
  if(sn){sn.onclick=function(){$("pan").hidden=!$("pan").hidden}}
  var ns=$("ns");
  if(ns){ns.onclick=function(){if(!S.rn){S.rn=true;ns.textContent="Pulsa otra vez para confirmar";return}S.rn=false;nextSeason(d,t);S.dt="clasif";renderDetail();toast("Temporada "+t.season+" creada")}}
  var sm=document.querySelectorAll(".sim");
  for(var s2=0;s2<sm.length;s2++){(function(b){b.onclick=function(){
    if(!b.getAttribute("data-c")){b.setAttribute("data-c","1");b.textContent="Pulsa otra vez para confirmar";return}
    if(b.hasAttribute("data-k")){simRound(d,t,+b.getAttribute("data-k"),ids)}else{simBr(d,t,+b.getAttribute("data-r"))}
    save(d);renderDetail();toast("Partidos simulados")}})(sm[s2])}
  var c8=$("c8");
  if(c8){c8.onclick=function(){var cor=null;d.tournaments.forEach(function(x){if(x.fixed==="corona"){cor=x}});
    var B=cor?brk(cor):{rs:[]},r=B.rs.length-3;
    if(r<0){toast("La Copa Corona aún no tiene cuartos de final");return}
    var got=[];B.rs[r].forEach(function(m){if(m.a!==null){got.push(m.a)}if(m.b!==null){got.push(m.b)}});
    if(got.length<8){toast("Aún no se han decidido los 8 equipos");return}
    var cur=effMem(d,t).map(function(m){return m.id}),add=got.filter(function(id){return cur.indexOf(id)<0});
    if(cur.length+add.length>t.cap){toast("Máximo "+t.cap+" equipos. Quita equipos antes de añadir.");return}
    revRes(d,t);delete t.draw;t.res={};t.members=(t.members||[]).concat(add.map(function(id){return{id:id,lg:0}}));
    save(d);renderDetail();toast(add.length+" equipos añadidos")}}
}
function tfNew(){return{name:"",kind:"liga",legs:1,win:3,draw:1,loss:0,mode:"single",n:2,names:["Primera","Segunda","Tercera","Cuarta","Quinta","Sexta","Séptima","Octava","Novena","Décima"],up:2,upPo:0,down:2,downPo:0}}
function sel(id,a,b,v){var o="";for(var i=a;i<=b;i++){o+='<option'+(i===v?' selected':'')+'>'+i+'</option>'}return '<select id="'+id+'">'+o+'</select>'}
function seg(id,opts,v){return '<div class="seg" id="'+id+'">'+opts.map(function(o){return '<button type="button" data-v="'+o[0]+'" class="'+(String(o[0])===String(v)?"on":"")+'">'+o[1]+'</button>'}).join("")+'</div>'}
function pts(f){return '<label>Número de encuentros</label>'+seg("legs",[[1,"Solo ida"],[2,"Ida y vuelta"]],f.legs)+'<div class="sec2">Puntos</div><div class="grid"><div><label for="win">Victoria</label>'+sel("win",1,10,f.win)+'</div><div><label for="draw">Empate</label>'+sel("draw",1,10,f.draw)+'</div><div><label for="loss">Derrota</label>'+sel("loss",0,10,f.loss)+'</div></div>'}
function zone(id,color,txt,v){return '<div><label for="'+id+'"><span class="dot" style="background:'+color+'"></span>'+txt+'</label>'+sel(id,0,10,v)+'</div>'}
function sync(){var f=S.tf,e=$("tn");if(e){f.name=e.value}
  ["win","draw","loss","up","upPo","down","downPo"].forEach(function(k){var s=$(k);if(s){f[k]=+s.value}});
  var ls=document.querySelectorAll(".ln");for(var i=0;i<ls.length;i++){f.names[+ls[i].getAttribute("data-i")]=ls[i].value}}
function openTForm(){S.tf=tfNew();S.view="tform";render()}
function renderTForm(){
  var f=S.tf,h='<div class="form"><h2>Nuevo torneo</h2><label for="tn">Nombre</label><input id="tn" maxlength="30" placeholder="Ej. Liga de los viernes" value="'+esc(f.name)+'"><label>Sección</label>'+seg("kind",[["liga","Liga única"],["torneo","Torneo"],["escalable","Ligas escalables"]],f.kind);
  if(f.kind==="liga"){h+=pts(f)}
  else if(f.kind==="torneo"){h+='<label>Modo</label>'+seg("mode",[["single","Eliminación directa"],["double","Eliminación doble"]],f.mode)+'<div class="hint">'+(f.mode==="double"?"Cada eliminatoria se juega a doble partido.":"Cada eliminatoria se juega a un solo partido.")+'</div>'}
  else{
    h+='<label>Número de ligas</label>'+sel("n",1,10,f.n);
    for(var i=0;i<f.n;i++){h+='<label for="ln'+i+'">Nombre de la liga '+(i+1)+'</label><input class="ln" id="ln'+i+'" data-i="'+i+'" maxlength="24" value="'+esc(f.names[i])+'">'}
    h+=pts(f);
    if(f.n>1){h+='<div class="sec2">Zonas de la clasificación</div><div class="hint">Equipos de 0 a 10 (0 = ninguno).</div><div class="grid2">'+zone("up","#14783f","Ascenso directo",f.up)+zone("upPo","#6fcf97","Ascenso play off",f.upPo)+zone("down","#d93636","Descenso",f.down)+zone("downPo","#f09a9a","Descenso play off",f.downPo)+'</div>'}
  }
  h+='<div class="err" id="err"></div><div class="actions"><button class="btn" id="save">Guardar</button><button class="btn sec" id="back">Volver</button></div></div>';
  $("app").innerHTML=h;
  var nn=$("n");if(nn){nn.onchange=function(){sync();f.n=+nn.value;renderTForm()}}
  var gs=document.querySelectorAll("#app .seg");
  for(var g=0;g<gs.length;g++){(function(el){var bs=el.querySelectorAll("button");for(var j=0;j<bs.length;j++){(function(b){b.onclick=function(){sync();var v=b.getAttribute("data-v");f[el.id]=(el.id==="kind"||el.id==="mode")?v:+v;renderTForm()}})(bs[j])}})(gs[g])}
  $("back").onclick=function(){S.view=null;render()};
  $("save").onclick=function(){
    sync();var n=f.name.trim(),d=load(),ts=d.tournaments||[];
    function err(m){$("err").textContent=m}
    if(!n){err("Escribe un nombre.");return}
    if(ts.some(function(t){return t.name.toLowerCase()===n.toLowerCase()})){err("Ya existe un torneo con ese nombre.");return}
    var o={id:Date.now(),name:n,kind:f.kind};
    if(f.kind==="torneo"){o.mode=f.mode}
    else{
      o.legs=f.legs;o.win=f.win;o.draw=f.draw;o.loss=f.loss;
      if(f.kind==="escalable"){
        var ls=f.names.slice(0,f.n).map(function(s){return s.trim()});
        if(ls.some(function(s){return !s})){err("Pon nombre a todas las ligas.");return}
        var low=ls.map(function(s){return s.toLowerCase()});
        if(low.some(function(s,k){return low.indexOf(s)!==k})){err("Los nombres de las ligas no pueden repetirse.");return}
        o.leagues=ls;
        if(f.n>1){o.up=f.up;o.upPo=f.upPo;o.down=f.down;o.downPo=f.downPo}
      }
    }
    d.tournaments=ts.concat([o]);save(d);S.view=null;S.tab="torneos";render();toast("Torneo guardado");
  };
}
function openForm(i){var d=load();S.view="form";S.edit=i;S.crest=i===null?"":(d.teams[i].crest||"");render()}
function renderForm(){
  var d=load(),i=S.edit,t=i===null?null:d.teams[i];
  var name=t?t.name:nextName(d.teams),val=t?t.value:"";
  $("app").innerHTML='<div class="form"><h2>'+(t?"Editar equipo":"Nuevo equipo")+'</h2>'+
  '<button class="crest" id="crest" aria-label="Subir escudo"></button><input type="file" id="file" accept="image/*" hidden>'+
  '<label for="nm">Nombre del equipo</label><input id="nm" maxlength="30" value="'+esc(name)+'">'+
  (t?'<label for="vl">Valor actual (cambia según los resultados)</label><input id="vl" readonly value="'+esc(val)+'">':'<label for="vl">Valor inicial (número entero, 1 o más)</label><input id="vl" type="number" inputmode="numeric" min="1" step="1" value="'+esc(val)+'"><div class="hint">Después no se puede cambiar a mano: sube o baja según los resultados.</div>')+'<label for="fn">Fans (cada fan suma 0,01 de valor por día)</label><input id="fn" type="number" inputmode="numeric" min="0" step="1" value="'+(t&&t.fans?t.fans:0)+'"><div class="chips"><button type="button" class="sim" data-f="1">+1</button><button type="button" class="sim" data-f="10">+10</button><button type="button" class="sim" data-f="100">+100</button><button type="button" class="sim" data-f="1000">+1000</button></div>'+
  '<div class="err" id="err"></div>'+
  '<div class="actions"><button class="btn" id="save">Guardar</button><button class="btn sec" id="back">Volver</button></div></div>';
  function paint(){$("crest").innerHTML=S.crest?'<img alt="" src="'+esc(S.crest)+'">':'<span>+</span><small>Subir escudo</small>'}
  function err(m){$("err").textContent=m}
  paint();
  var fb=document.querySelectorAll("[data-f]");
  for(var q=0;q<fb.length;q++){(function(b){b.onclick=function(){$("fn").value=(+$("fn").value||0)+(+b.getAttribute("data-f"))}})(fb[q])}
  $("crest").onclick=function(){$("file").click()};
  $("file").onchange=function(){
    var f=this.files[0];if(!f){return}
    var r=new FileReader();
    r.onload=function(){var im=new Image();im.onload=function(){
      var c=document.createElement("canvas");c.width=c.height=72;
      var x=c.getContext("2d"),k=72/Math.max(im.width,im.height),w=im.width*k,h=im.height*k;
      x.drawImage(im,(72-w)/2,(72-h)/2,w,h);
      S.crest=c.toDataURL("image/png");paint();
    };im.src=r.result};
    r.readAsDataURL(f);
  };
  $("back").onclick=function(){S.view=null;render()};
  $("save").onclick=function(){
    var n=$("nm").value.trim(),v=$("vl").value.trim();
    if(!n){err("Escribe un nombre.");return}
    var dup=d.teams.some(function(q,k){return k!==i&&q.name.toLowerCase()===n.toLowerCase()});
    if(dup){err("Ya existe un equipo con ese nombre.");return}
    if(!t&&(!/^\d+$/.test(v)||+v<1)){err("El valor debe ser un número entero de 1 en adelante.");return}
    var fs=$("fn").value.trim();if(!/^\d*$/.test(fs)){err("Los fans deben ser un número entero de 0 en adelante.");return}
    var o={id:t?t.id:Date.now(),name:n,value:t?t.value:+v,crest:S.crest,fans:+fs||0};
    if(t){d.teams[i]=o}else{d.teams.push(o)}
    save(d);S.view=null;render();toast("Equipo guardado");
  };
}

function render(){
  if(S.view==="form"){renderForm()}else if(S.view==="tform"){renderTForm()}else if(S.view==="detail"){if(S.picker){renderPicker()}else{renderDetail()}}else if(S.view==="match"){renderMatch()}else{renderMain()}
  renderDrawer();
}
